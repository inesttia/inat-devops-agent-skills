AWSTemplateFormatVersion: '2010-09-09'
Description: >
  payments-ledger: event archive, lookup table, relational ledger, and
  alerting for the payments service. This version adds a Multi-AZ PostgreSQL
  ledger database, a customer-managed KMS key, a NAT gateway for the
  reconciler's egress, and moves the index table to provisioned capacity.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment, used in resource names and tags.
  DbInstanceClass:
    Type: String
    Default: db.r6g.large
    Description: Instance class for the ledger database.
  DbAllocatedStorageGb:
    Type: Number
    Default: 200
    Description: Allocated gp3 storage for the ledger database, in GiB.
  DbSubnetIds:
    Type: CommaDelimitedList
    Default: subnet-0a1b2c3d4e5f60001,subnet-0a1b2c3d4e5f60002
    Description: Private subnets for the database subnet group.
  NatPublicSubnetId:
    Type: String
    Default: subnet-0a1b2c3d4e5f60010
    Description: Public subnet that hosts the NAT gateway.

Resources:
  EventsArchive:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub payments-events-archive-${Environment}-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldEvents
            Status: Enabled
            ExpirationInDays: 365
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: payments

  LedgerIndex:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub payments-ledger-index-${Environment}
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 50
        WriteCapacityUnits: 25
      AttributeDefinitions:
        - AttributeName: paymentId
          AttributeType: S
        - AttributeName: eventTime
          AttributeType: S
      KeySchema:
        - AttributeName: paymentId
          KeyType: HASH
        - AttributeName: eventTime
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: payments

  LedgerAlerts:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub payments-ledger-alerts-${Environment}
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: payments

  LedgerKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub Encryption key for the payments ledger database (${Environment})
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountRoot
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: payments

  LedgerDbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub Private subnets for the payments ledger (${Environment})
      SubnetIds: !Ref DbSubnetIds
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: payments

  LedgerDb:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub payments-ledger-${Environment}
      Engine: postgres
      EngineVersion: '16'
      DBInstanceClass: !Ref DbInstanceClass
      MultiAZ: true
      AllocatedStorage: !Ref DbAllocatedStorageGb
      StorageType: gp3
      StorageEncrypted: true
      KmsKeyId: !Ref LedgerKey
      DBSubnetGroupName: !Ref LedgerDbSubnetGroup
      MasterUsername: ledger_admin
      ManageMasterUserPassword: true
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      DeletionProtection: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: payments

  ReconcilerNatEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub payments-reconciler-nat-${Environment}
        - Key: Environment
          Value: !Ref Environment

  ReconcilerNatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt ReconcilerNatEip.AllocationId
      SubnetId: !Ref NatPublicSubnetId
      Tags:
        - Key: Name
          Value: !Sub payments-reconciler-nat-${Environment}
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: payments

  ReconcilerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/payments-reconciler-${Environment}
      RetentionInDays: 30

Outputs:
  ArchiveBucket:
    Value: !Ref EventsArchive
  IndexTable:
    Value: !Ref LedgerIndex
  AlertsTopic:
    Value: !Ref LedgerAlerts
  LedgerEndpoint:
    Value: !GetAtt LedgerDb.Endpoint.Address
  NatGatewayId:
    Value: !Ref ReconcilerNatGateway
